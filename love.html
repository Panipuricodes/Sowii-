<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sweetuuü ♥</title>
    <!-- Google Fonts for elegant typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #07020a;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 2, 10, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff80bf;
            font-size: 22px;
            font-weight: 500;
            cursor: pointer;
            z-index: 10;
            letter-spacing: 2px;
            text-align: center;
            padding: 20px;
            box-shadow: inset 0 0 80px rgba(255, 46, 147, 0.25);
            font-family: 'Dancing Script', cursive;
            font-size: 32px;
        }
    </style>
</head>
<body>

    <div id="overlay">Click anywhere, Honey♥</div>
    <canvas id="canvas"></canvas>

    <audio id="bgm" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    </audio>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const bgm = document.getElementById('bgm');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Background Floating Full Phrases: "I LOVE YOU ♥"
const phrase = "I LOVE YOU ♥";
let floatingPhrases = [];
const numColumns = Math.floor(window.innerWidth / 20);

function initPhrases() {
    floatingPhrases = [];
    for (let i = 0; i < numColumns * 3; i++) {
        floatingPhrases.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            speed: Math.random() * 0.3 + 0.15, // Smooth slow drift
            opacity: Math.random() * 0.25 + 0.12,
            size: Math.floor(Math.random() * 4) + 12
        });
    }
}
initPhrases();
window.addEventListener('resize', initPhrases);

// Text Sequence
const sequence = ["Sweetuuü", "You", "Are", "My", "Everything", "Please", "Forgive", "Me", "My Princess", "( •̀ ω •́ )✧", "Muah", "Muahh", "Muahhh", "Muahhhh"];
let seqIndex = 0;
let frameTimer = 0;
let state = "SEQUENCE"; 
let particles = [];
let heartSparkles = [];

// Sparkles floating gently around the heart path
function initHeartSparkles(count = 120) {
    heartSparkles = [];
    for (let i = 0; i < count; i++) {
        heartSparkles.push({
            t: Math.random() * Math.PI * 2,
            speed: (Math.random() * 0.005 + 0.002) * (Math.random() > 0.5 ? 1 : -1),
            offset: (Math.random() - 0.5) * 18,
            size: Math.random() * 2.5 + 1,
            alpha: Math.random() * 0.8 + 0.2
        });
    }
}

// Draw Floating Full Phrase Background
function drawBackground() {
    ctx.fillStyle = 'rgba(7, 2, 10, 0.35)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    floatingPhrases.forEach(p => {
        ctx.font = `600 ${p.size}px 'Poppins', sans-serif`;
        ctx.fillStyle = `rgba(255, 117, 181, ${p.opacity})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(255, 46, 147, 0.4)';
        ctx.fillText(phrase, p.x, p.y);

        p.y += p.speed;
        if (p.y > canvas.height + 20) {
            p.y = -20;
            p.x = Math.random() * canvas.width;
        }
    });
}

// Parametric Heart Point Calculation
function getHeartPoint(t, scale) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    return {
        x: canvas.width / 2 + x * scale,
        y: canvas.height / 2 + y * scale - 15
    };
}

// Render Smooth Glowing Vector Heart
function drawSmoothHeart(time) {
    const baseScale = Math.min(canvas.width, canvas.height) / 40;
    const pulse = 1 + Math.sin(time * 0.04) * 0.035; // Gentle breathing pulse
    const scale = baseScale * pulse;

    // 1. Soft Outer Glow Layer
    ctx.save();
    ctx.beginPath();
    for (let t = 0; t <= Math.PI * 2; t += 0.02) {
        const pt = getHeartPoint(t, scale);
        if (t === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#ff2e93';
    ctx.lineWidth = 8;
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#ff2e93';
    ctx.globalAlpha = 0.6;
    ctx.stroke();
    ctx.restore();

    // 2. Crisp Inner Heart Line
    ctx.save();
    ctx.beginPath();
    for (let t = 0; t <= Math.PI * 2; t += 0.01) {
        const pt = getHeartPoint(t, scale);
        if (t === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3.5;
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ffffff';
    ctx.stroke();
    ctx.restore();

    // 3. Subtle Edge Sparkles
    heartSparkles.forEach(s => {
        s.t += s.speed;
        const pt = getHeartPoint(s.t, scale);
        const sx = pt.x + Math.cos(s.t * 5) * s.offset;
        const sy = pt.y + Math.sin(s.t * 5) * s.offset;

        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff7bbf';
        ctx.globalAlpha = s.alpha * (0.7 + Math.sin(time * 0.1) * 0.3);
        ctx.beginPath();
        ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

function animate() {
    drawBackground();
    frameTimer++;

    if (state === "SEQUENCE") {
        ctx.fillStyle = "#ffffff";
        ctx.font = `700 ${Math.min(canvas.width, canvas.height) / 9}px 'Dancing Script', cursive`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = "#ff2e93";
        ctx.shadowBlur = 35;
        
        ctx.fillText(sequence[seqIndex], canvas.width / 2, canvas.height / 2);

        if (frameTimer > 55) {
            frameTimer = 0;
            seqIndex++;
            if (seqIndex >= sequence.length) {
                state = "HEART";
                initHeartSparkles();
            }
        }
    } 
    else if (state === "HEART") {
        drawSmoothHeart(frameTimer);

        // Center Message inside Heart
        ctx.fillStyle = "#ffffff";
        ctx.font = `700 ${Math.min(canvas.width, canvas.height) / 18}px 'Dancing Script', cursive`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff2e93';
        
        ctx.fillText("I Love You Sweetuuü ♥", canvas.width / 2, canvas.height / 2 - 10);
    }

    requestAnimationFrame(animate);
}

overlay.addEventListener('click', () => {
    overlay.style.display = 'none';
    bgm.play().catch(e => console.log("Audio autoplay prevented", e));
    animate();
});
</script>
</body>
</html>
